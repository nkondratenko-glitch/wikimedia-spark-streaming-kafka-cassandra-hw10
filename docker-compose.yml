version: "3.8"

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: hw10-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - stream-net

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: hw10-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      - stream-net

  kafka-init:
    image: confluentinc/cp-kafka:7.6.1
    container_name: hw10-kafka-init
    depends_on:
      - kafka
    command: >
      bash -c '
        echo "Waiting for Kafka...";
        cub kafka-ready -b kafka:9092 1 30;
        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic input --partitions 1 --replication-factor 1;
        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic processed --partitions 1 --replication-factor 1;
        kafka-topics --bootstrap-server kafka:9092 --list;
      '
    networks:
      - stream-net

  cassandra:
    image: cassandra:4.1
    container_name: hw10-cassandra
    ports:
      - "9042:9042"
    environment:
      CASSANDRA_CLUSTER_NAME: hw10-cluster
    volumes:
      - cassandra-data:/var/lib/cassandra
      - ./cassandra/schema.cql:/schema.cql
    networks:
      - stream-net

  spark-master:
    image: bitnami/spark:3.5
    container_name: hw10-spark-master
    environment:
      - SPARK_MODE=master
    ports:
      - "8080:8080"
      - "7077:7077"
    volumes:
      - ./src/spark:/opt/bitnami/spark/jobs
    networks:
      - stream-net

  spark-worker:
    image: bitnami/spark:3.5
    container_name: hw10-spark-worker
    depends_on:
      - spark-master
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_MEMORY=1G
      - SPARK_WORKER_CORES=1
    volumes:
      - ./src/spark:/opt/bitnami/spark/jobs
    networks:
      - stream-net

  generator:
    build:
      context: .
      dockerfile: Dockerfile.generator
    container_name: hw10-generator
    depends_on:
      - kafka-init
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: input
      WIKIMEDIA_STREAM_URL: https://stream.wikimedia.org/v2/stream/page-create
    networks:
      - stream-net
    restart: unless-stopped

volumes:
  cassandra-data:

networks:
  stream-net:
    driver: bridge
